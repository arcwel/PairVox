name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Engine + CLI (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  macos:
    name: Engine, CLI and app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Unit tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build app (unsigned)
        run: |
          xcodegen generate
          xcodebuild -project PairVox.xcodeproj -scheme PairVox -configuration Debug \
            -destination "generic/platform=macOS" -derivedDataPath .build/xcode \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build
