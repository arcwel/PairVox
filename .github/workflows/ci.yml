name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Engine + CLI (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift build
      - run: swift test

  macos:
    name: Engine, CLI and app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Unit tests
        # The default SwiftPM build system rejects the KokoroSwift/MisakiSwift dynamic products
        # that both embed MLX; Xcode handles it. See docs/HANDOFF.md §4.
        run: swift test --build-system native
      - name: Install XcodeGen (pinned release, checksum verified)
        run: |
          curl -fsSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build app (unsigned)
        run: |
          xcodegen generate
          xcodebuild -project PairVox.xcodeproj -scheme PairVox -configuration Debug \
            -destination "generic/platform=macOS" -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO build
